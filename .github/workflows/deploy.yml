# Deploy main to the production EC2 host over SSH.
#
# The runner builds nothing and holds no code. It opens one SSH session to the
# EC2 host, which fast-forwards its own checkout to main and runs
# scripts/deploy.sh: build the images there, roll them out with Compose, and
# verify health. The run fails if the new version does not become healthy.
#
# No AWS credentials are involved: GitHub only holds an SSH key that can log in
# as ec2-user. Production secrets (.env.production) exist only on the host and
# never pass through GitHub.
#
# One-time setup (key pair, authorized_keys, secrets) is in README "Deployment".
name: Deploy

on:
  # Automatic deploys start from CI, never from the push itself. A push to main
  # runs CI; when that CI run completes, this workflow is triggered with the
  # run's result and the exact commit it tested. The job below deploys only
  # when that run succeeded, so an automatic deploy can never get ahead of CI.
  #
  # `workflows` names the CI workflow by its `name:` (ci.yml -> "CI").
  # workflow_run always uses this file as it is on the default branch.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual run from the Actions tab, e.g. to redeploy after fixing the host.
  # Deliberately not gated on CI: it is the operator's override. It deploys the
  # main commit it was started on.
  workflow_dispatch:

# The job needs no GitHub token access at all: it never checks out the code,
# and the EC2 host fetches main with its own read-only deploy key.
permissions: {}

# One deployment at a time, and never cancel one halfway: an interrupted
# rollout can leave some containers on the new version and some on the old.
# A deploy triggered while another runs waits for it, then deploys its own
# commit (and skips it if the host already runs something newer).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Two ways in, each with its own conditions:
    #
    # Manual: workflow_dispatch started on main.
    #
    # Automatic, all of:
    #   - the repository variable DEPLOY_ON_PUSH is "true" (Settings ->
    #     Secrets and variables -> Actions -> Variables). Until it is, CI
    #     passing on main deploys nothing;
    #   - the CI run succeeded (not failed, cancelled or skipped);
    #   - it was CI for a push, not for a pull request;
    #   - on main of this repository. A fork's pull request can also have a
    #     head branch called "main", which the `branches` filter alone would
    #     let through; the event and repository checks shut that out.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       vars.DEPLOY_ON_PUSH == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # Covers building both images on the host plus the health wait.
    timeout-minutes: 30

    steps:
      - name: Check that the deployment secrets are set
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_PRIVATE_KEY EC2_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ${name} is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install the SSH key and the pinned host key
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Written with printf and a trailing newline: an OpenSSH private key
          # without its final newline is rejected as "invalid format".
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The EC2 host's own public key, captured on the host itself. With
          # StrictHostKeyChecking=yes below, ssh refuses to connect to anything
          # that does not present exactly this key — so a hijacked IP or DNS
          # entry cannot receive the session.
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on the EC2 host
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          # The exact commit to deploy. For workflow_run it must be the commit
          # CI tested (head_sha): github.sha is merely the default branch's tip
          # at trigger time, which may be a newer commit CI has not passed.
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        # The heredoc is quoted ('REMOTE'), so nothing in it is expanded on the
        # runner; it runs as a script on the host, with the commit as $1.
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "${EC2_USER}@${EC2_HOST}" \
            bash -s -- "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          target="$1"
          cd ~/api-watchdog

          if ! [[ "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "[deploy] FAILED: not a full commit SHA: '${target}'" >&2
            exit 1
          fi

          # Refuse to deploy over hand edits to tracked files: a fast-forward
          # would either fail on them or silently keep them running. Untracked
          # files (.env.production is gitignored) are not affected.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "[deploy] FAILED: tracked files are modified on the host:" >&2
            git status --short --untracked-files=no >&2
            exit 1
          fi

          previous="$(git rev-parse --short HEAD)"
          git fetch origin main
          git checkout main

          # Deploy exactly the commit this run was started for — not the tip of
          # main, which may already hold a newer commit whose CI has not
          # passed. It must be part of main's history.
          if ! git merge-base --is-ancestor "$target" origin/main; then
            echo "[deploy] FAILED: ${target:0:7} is not on origin/main" >&2
            exit 1
          fi

          # Never go backwards. CI runs can finish out of order; if the host
          # already runs a newer main commit, this older one is obsolete.
          current="$(git rev-parse HEAD)"
          if [ "$current" != "$target" ] && git merge-base --is-ancestor "$target" "$current"; then
            echo "[deploy] host already runs ${current:0:7}, which is newer than ${target:0:7}; nothing to deploy"
            exit 0
          fi

          # Fast-forward the local main to that commit. Only a fast-forward: a
          # host history that has diverged from origin fails here instead of
          # being merged.
          git merge --ff-only "$target"
          echo "[deploy] ${previous} -> $(git rev-parse --short HEAD)"

          # The script from the commit being deployed, so a change to it takes
          # effect in the same deployment that ships it.
          exec bash scripts/deploy.sh
          REMOTE

      - name: Remove the SSH key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
