# Nginx server block for the production frontend image (apps/web/Dockerfile.prod).
#
# Replaces the image's default /etc/nginx/conf.d/default.conf. It serves the
# static files `vite build` produced, and proxies /api/* to the API container.

server {
    # 8080, not 80: the unprivileged image runs as a non-root user, which may
    # not bind ports below 1024. The host (or a load balancer) maps whatever
    # public port it wants onto this one.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact Nginx version in headers and error pages.
    server_tokens off;

    # Off by default in Nginx. The JS bundle is the bulk of every first load
    # and compresses to roughly a third of its size.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The SPA fallback.
    #
    # React Router owns every client-side path (/login, /dashboard,
    # /monitors/:id/history, ...). None of those exist as files, so a refresh
    # or a pasted link would 404 at this layer before React ever loaded. Serve
    # the file if there is one, otherwise hand the request to index.html and
    # let the router decide — including rendering its own not-found page.
    location / {
        try_files $uri /index.html;
    }

    # index.html must never be cached. It is the one file that names the
    # current hashed bundle, so a stale copy would keep loading the previous
    # release after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite puts a content hash in every filename under assets/, so a file at a
    # given URL never changes and can be cached indefinitely.
    #
    # No fallback here, on purpose: a missing asset must be a real 404. Falling
    # back to index.html would answer a request for JavaScript with HTML and
    # turn a clear error into a confusing one.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /api/* goes to the Express API, on this same origin.
    #
    # The bundle calls relative /api/... paths, so the browser only ever talks
    # to this server: no separate API origin, and the API needs no CORS rules.
    # This block also keeps API paths out of the SPA fallback above — an API
    # request must never be answered with index.html.
    #
    # `api` is the Compose service name, resolved by Docker's embedded DNS at
    # 127.0.0.11 (present on every Compose network, locally and on EC2).
    #
    # The upstream is a variable on purpose. A literal `proxy_pass http://api:3000`
    # is resolved once, at startup, which has two costs:
    #   - Nginx refuses to start if `api` does not resolve, so the image could
    #     no longer be run on its own to test the static site.
    #   - The address is cached forever. Recreating the api container gives it
    #     a new IP, and Nginx would keep sending traffic to the old one (502s)
    #     until it was restarted too.
    # With a variable, Nginx resolves per request through `resolver` and
    # re-checks every 10s. Run standalone, /api/* returns 502 once the 5s
    # resolver timeout expires; the static site is unaffected.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_upstream http://api:3000;

        # No URI after the host: the request path is passed through unchanged,
        # so /api/auth/me reaches Express as /api/auth/me — its routes are
        # mounted with the /api prefix.
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        # Appends the real peer address to anything the client sent. Express
        # trusts exactly one hop (app.set('trust proxy', 1)), so it reads only
        # this right-most entry and ignores any fakes to its left.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
